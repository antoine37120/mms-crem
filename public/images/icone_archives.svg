<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 3. PUBLICATIONS / ARCHIVES : Bobine magnétique -->
    <g transform="translate(50, 50)">
        <!-- Deux cercles de bobine -->
        <circle cx="-18" cy="0" r="18" stroke="#2c3e50" stroke-width="2" fill="none"/>
        <circle cx="18" cy="0" r="18" stroke="#2c3e50" stroke-width="2" fill="none"/>

        <!-- Noyaux intérieurs -->
        <circle cx="-18" cy="0" r="6" fill="#2c3e50"/>
        <circle cx="18" cy="0" r="6" fill="#2c3e50"/>

        <!-- Axe central diagonal -->
        <line x1="0" y1="-8" x2="8" y2="8" stroke="#2c3e50" stroke-width="1.2"/>
    </g>
</svg>
