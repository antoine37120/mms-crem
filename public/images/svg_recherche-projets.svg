<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 1. RECHERCHE / PROJETS : Le Cordophone Stylisé -->
    <g transform="translate(50, 50)">
        <!-- Arc de cercle -->
        <path d="M -32 16 Q 0 -24 32 16" stroke="#2c3e50" stroke-width="2" fill="none"/>
        <!-- Points d'ancrage -->
        <circle cx="-32" cy="16" r="3" fill="#2c3e50"/>
        <circle cx="32" cy="16" r="3" fill="#2c3e50"/>
        <!-- Corde tendue -->
        <line x1="-32" y1="16" x2="32" y2="16" stroke="#2c3e50" stroke-width="2"/>
        <!-- Hachures vibratoires -->
        <line x1="-24" y1="16" x2="-26" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="-16" y1="16" x2="-18" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="-8" y1="16" x2="-10" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="0" y1="16" x2="-2" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="8" y1="16" x2="6" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="16" y1="16" x2="14" y2="24" stroke="#2c3e50" stroke-width="1"/>
        <line x1="24" y1="16" x2="22" y2="24" stroke="#2c3e50" stroke-width="1"/>
    </g>
</svg>
