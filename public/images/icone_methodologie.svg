<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 2. MÉTHODOLOGIE : Le Carnet de Terrain -->
    <g transform="translate(50, 50)">
        <!-- Rectangle du carnet -->
        <rect x="-32" y="-32" width="64" height="64" stroke="#2c3e50" stroke-width="2" fill="none"/>
        <!-- Ligne centrale (reliure) -->
        <line x1="0" y1="-32" x2="0" y2="32" stroke="#2c3e50" stroke-width="2"/>

        <!-- Page gauche : fragment polygonal -->
        <path d="M -22 -18 L -10 -24 L -5 -12 L -13 -7 Z" stroke="#2c3e50" stroke-width="1.2" fill="none"/>
        <polyline points="-20,0 -16,6 -9,3 -5,10" stroke="#2c3e50" stroke-width="1" fill="none"/>

        <!-- Page droite : lignes de texte -->
        <line x1="4" y1="-18" x2="27" y2="-18" stroke="#2c3e50" stroke-width="0.8"/>
        <line x1="4" y1="-9" x2="27" y2="-9" stroke="#2c3e50" stroke-width="0.8"/>
        <line x1="4" y1="0" x2="27" y2="0" stroke="#2c3e50" stroke-width="0.8"/>
        <line x1="4" y1="9" x2="27" y2="9" stroke="#2c3e50" stroke-width="0.8"/>
        <line x1="4" y1="18" x2="27" y2="18" stroke="#2c3e50" stroke-width="0.8"/>
    </g>
</svg>
