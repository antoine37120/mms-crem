<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 4. PARTENARIATS / COLLOQUES : La Dyade Relationnelle -->
    <g transform="translate(50, 50)">
        <!-- Figure 1 (gauche) -->
        <circle cx="-20" cy="-4" r="7.5" stroke="#2c3e50" stroke-width="2" fill="none"/>
        <rect x="-24" y="5" width="8" height="20" stroke="#2c3e50" stroke-width="2" fill="none"/>

        <!-- Figure 2 (droite) -->
        <circle cx="20" cy="-4" r="7.5" stroke="#2c3e50" stroke-width="2" fill="none"/>
        <rect x="16" y="5" width="8" height="20" stroke="#2c3e50" stroke-width="2" fill="none"/>

        <!-- Flux de connexion bidirectionnel (spirale) -->
        <path d="M -11 0 Q 0 -12 11 0" stroke="#2c3e50" stroke-width="1.3" fill="none"/>
        <path d="M 11 4 Q 0 16 -11 4" stroke="#2c3e50" stroke-width="1.3" fill="none"/>
    </g>
</svg>
